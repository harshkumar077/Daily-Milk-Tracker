<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f5ef">
  <meta name="description" content="A simple daily milk tracker for the family.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🥛%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=4">
  <title>Daily Milk Tracker</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">🥛</span><span>Daily Milk Tracker</span><span id="sync-status" class="sync-status">Local</span></div>
      <button class="icon-button" id="settings-button" aria-label="Open settings" title="Settings">⚙</button>
    </header>

    <main id="app" aria-live="polite"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item active" data-view="today"><span>☀</span><strong>Today</strong></button>
      <button class="nav-item" data-view="calendar"><span>▦</span><strong>Calendar</strong></button>
      <button class="nav-item" data-view="history"><span>◷</span><strong>History</strong></button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase/config.js"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
